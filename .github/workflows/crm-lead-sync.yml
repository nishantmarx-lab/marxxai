name: CRM lead sync
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency: crm-lead-sync
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scripts/crm-sync/requirements.txt
      - run: python scripts/crm-sync/sync_leads_to_kylas.py
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}
